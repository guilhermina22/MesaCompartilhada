{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Mesa Compartilhada</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{
    height:100vh;
}


.container{

    display:flex;
    height:100vh;

}



/* LADO ESQUERDO */

.left{

    width:50%;
    
    background:
    linear-gradient(
        rgba(37,112,82,0.75),
        rgba(37,112,82,0.75)
    ),
    url("COLOCA_AQUI_A_URL_DA_IMAGEM");

    background-size:cover;
    background-position:center;

    color:white;

    padding:35px;

    position:relative;

}



.logo h2{

    font-family:Georgia,serif;
    font-size:18px;

}


.logo p{

    font-size:12px;

}



.frase{

    position:absolute;

    bottom:45px;
    left:35px;

    width:390px;

}


.frase h3{

    font-family:Georgia,serif;

    font-style:italic;

    font-size:20px;

}



/* LADO DIREITO */


.right{

    width:50%;

    background:#faf7f2;

    display:flex;

    justify-content:center;

    align-items:center;

}



.form{

    width:265px;

}


.form h1{

    font-family:Georgia,serif;

    font-size:23px;

}



.sub{

    font-size:12px;

    color:#888;

    margin:8px 0 25px;

}



.tipo{

    display:flex;

    border:1px solid #ddd;

    border-radius:7px;

    overflow:hidden;

}



.tipo button{

    width:50%;

    height:28px;

    border:none;

    background:white;

}



.tipo .ativo{

    background:#287653;

    color:white;

}



label{

    font-size:11px;

    display:block;

    margin-top:15px;

}



input{

    width:100%;

    height:30px;

    border-radius:7px;

    border:1px solid #ddd;

    background:#eee9e2;

    padding:10px;

}



.entrar{

    width:100%;

    height:30px;

    margin-top:20px;

    background:#287653;

    color:white;

    border:none;

    border-radius:7px;

}



.cadastro{

    text-align:center;

    font-size:12px;

    margin-top:18px;

}


.cadastro a{

    color:#287653;

}


</style>

</head>


<body>


<div class="container">


<div class="left">


<div class="logo">

<h2>🍴 Mesa Compartilhada</h2>

<p>
Reduzindo o desperdício, ampliando o acesso.
</p>

</div>



<div class="frase">

<h3>
"No Brasil, 46 milhões de toneladas de alimentos são desperdiçadas por ano."
</h3>

<small>
FONTE: ONU / EMBRAPA
</small>

</div>



</div>




<div class="right">


<div class="form">


<h1>
Bem-vindo de volta
</h1>


<p class="sub">
Acesse sua conta para continuar.
</p>



<div class="tipo">

<button class="ativo">
Consumidor
</button>

<button>
Comércio
</button>

</div>



<label>
E-mail
</label>

<input placeholder="seu@email.com">



<label>
Senha
</label>

<input type="password" placeholder="••••••••">



<button class="entrar">
Entrar
</button>



<p class="cadastro">
Não tem conta?
<a href="#">
Cadastre-se
</a>
</p>


</div>


</div>



</div>


</body>

</html>
